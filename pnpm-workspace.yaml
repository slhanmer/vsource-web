allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  lodash: '>=4.18.0'
  lodash-es: '>=4.18.0'
  picomatch: '>=4.0.4'
  immutable: '>=5.1.5'
  sharp: '>=0.35.0'
  'next>postcss': '>=8.5.18'
# The starter's drizzle fix (patches/README.md). In the starter this is
# `pnpm.patchedDependencies` in package.json; pnpm 11 reads it only from here.
# Deliberately unversioned, so a minor bump does not silently drop it.
patchedDependencies:
  '@payloadcms/drizzle': patches/@payloadcms__drizzle.patch
