<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="d1" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#455A64"/></marker>
    <marker id="d2" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#F9A825"/></marker>
    <style>
      .t{font-size:12.5px;fill:#1a1a1a}
      .ti{font-size:10.5px;font-style:italic;fill:#546E7A}
      .h{font-size:13px;font-weight:bold}
      .edge{stroke:#455A64;stroke-width:1.6;fill:none}
      .pl{stroke:#F9A825;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
      .lbl{font-size:10.5px;fill:#37474F}
    </style>
  </defs>
  <rect width="1020" height="620" fill="#ffffff"/>

  <rect x="390" y="20" width="240" height="50" rx="8" fill="#E3F2FD" stroke="#1565C0"/>
  <text class="t" x="510" y="41" text-anchor="middle">Clinical / Admin Users</text>
  <text class="ti" x="510" y="58" text-anchor="middle">HTTPS over the internet</text>

  <!-- NextDC primary -->
  <rect x="40" y="120" width="470" height="360" rx="12" fill="#F4FAF5" stroke="#2E7D32" stroke-width="2"/>
  <text class="h" x="60" y="146" fill="#2E7D32">NextDC — Primary Site (LIVE)</text>
  <text class="ti" x="60" y="164">ISO 27001 · SOC 2 Type II · Uptime Tier IV · DTA Certified Strategic</text>

  <rect x="80" y="185" width="390" height="70" rx="8" fill="#E8F5E9" stroke="#2E7D32"/>
  <text class="t" x="275" y="210" text-anchor="middle">Web Application Tier</text>
  <text class="ti" x="275" y="228" text-anchor="middle">Next.js front-end + Express back-end</text>
  <text class="ti" x="275" y="243" text-anchor="middle">GPU-backed host for 3D workload</text>

  <rect x="80" y="290" width="185" height="64" rx="8" fill="#E8F5E9" stroke="#2E7D32"/>
  <text class="t" x="172" y="315" text-anchor="middle">Per-tenant MySQL</text>
  <text class="ti" x="172" y="333" text-anchor="middle">segregated DBs</text>

  <rect x="285" y="290" width="185" height="64" rx="8" fill="#E8F5E9" stroke="#2E7D32"/>
  <text class="t" x="377" y="315" text-anchor="middle">Object Storage (S3)</text>
  <text class="ti" x="377" y="333" text-anchor="middle">via Rust File Service</text>

  <path class="edge" marker-end="url(#d1)" d="M230,255 L200,288"/>
  <path class="edge" marker-end="url(#d1)" d="M320,255 L355,288"/>

  <!-- AWS secondary -->
  <rect x="560" y="120" width="420" height="360" rx="12" fill="#FFFDF5" stroke="#F9A825" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="h" x="580" y="146" fill="#B8860B">AWS — Secondary / Failover</text>
  <text class="ti" x="580" y="164">PLANNED — not yet provisioned</text>

  <rect x="600" y="185" width="340" height="70" rx="8" fill="#FFF8E1" stroke="#F9A825" stroke-dasharray="5 4"/>
  <text class="t" x="770" y="216" text-anchor="middle">Standby Web / API Tier</text>
  <text class="ti" x="770" y="234" text-anchor="middle">warm standby (planned)</text>

  <rect x="600" y="290" width="340" height="64" rx="8" fill="#FFF8E1" stroke="#F9A825" stroke-dasharray="5 4"/>
  <text class="t" x="770" y="315" text-anchor="middle">Replicated Data Stores</text>
  <text class="ti" x="770" y="333" text-anchor="middle">MySQL + object storage replicas</text>

  <!-- users to web -->
  <path class="edge" marker-end="url(#d1)" d="M480,70 L275,183"/>
  <text class="lbl" x="410" y="120" text-anchor="middle">HTTPS</text>

  <!-- replication planned -->
  <path class="pl" marker-end="url(#d2)" d="M470,322 L598,322"/>
  <text class="lbl" x="534" y="314" text-anchor="middle" fill="#B8860B">replication</text>
  <path class="pl" marker-end="url(#d2)" d="M470,220 L598,220"/>
  <text class="lbl" x="534" y="212" text-anchor="middle" fill="#B8860B">DNS cutover / standby</text>

  <!-- Recovery note -->
  <rect x="40" y="510" width="940" height="70" rx="8" fill="#FAFAFA" stroke="#9E9E9E"/>
  <text class="h" x="60" y="534" fill="#37474F">Recovery objectives</text>
  <text class="ti" x="60" y="554">Baseline from company DR &amp; Return-to-Operations Plan v1.2: RTO 72 h · RPO 24 h (tighter product targets TBC). Aligned to ISO 22301 / ISO 27031 / NIST SP 800-34.</text>
  <text class="ti" x="60" y="571">No automated failover today — continuity currently relies on NextDC facility resilience + data backups. Deployment runbook: APT-45.</text>

  <text class="ti" x="980" y="605" text-anchor="end">APT-DOC-009 · Figure 4 — Deployment / Availability View</text>
</svg>
