<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="s1" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#37474F"/></marker>
    <style>
      .msg{font-size:11.5px;fill:#1a1a1a}
      .num{font-size:11px;font-weight:bold;fill:#5E35B1}
      .life{stroke:#B0BEC5;stroke-width:1.3;stroke-dasharray:4 4}
      .sig{stroke:#37474F;stroke-width:1.5;fill:none}
      .ret{stroke:#37474F;stroke-width:1.3;fill:none;stroke-dasharray:6 4}
      .hd{font-size:12px;fill:#1a1a1a}
      .hi{font-size:10px;font-style:italic;fill:#546E7A}
      .note{font-size:10.5px;fill:#5D4037}
    </style>
  </defs>
  <rect width="1200" height="980" fill="#ffffff"/>

  <!-- headers -->
  <g>
    <rect x="30" y="20" width="120" height="44" rx="7" fill="#FFF3E0" stroke="#EF6C00"/><text class="hd" x="90" y="40" text-anchor="middle">MultiScan4D</text><text class="hi" x="90" y="55" text-anchor="middle">Class A device</text>
    <rect x="190" y="20" width="120" height="44" rx="7" fill="#FFF3E0" stroke="#EF6C00"/><text class="hd" x="250" y="40" text-anchor="middle">Scan Pipeline</text><text class="hi" x="250" y="55" text-anchor="middle">black box</text>
    <rect x="380" y="20" width="120" height="44" rx="7" fill="#E1F5FE" stroke="#0277BD"/><text class="hd" x="440" y="40" text-anchor="middle">Back-end API</text><text class="hi" x="440" y="55" text-anchor="middle">TS/Express</text>
    <rect x="560" y="20" width="120" height="44" rx="7" fill="#E8F5E9" stroke="#2E7D32"/><text class="hd" x="620" y="40" text-anchor="middle">Rust File Svc</text><text class="hi" x="620" y="55" text-anchor="middle">S3 / AWS SDK</text>
    <rect x="730" y="20" width="120" height="44" rx="7" fill="#E8F5E9" stroke="#2E7D32"/><text class="hd" x="790" y="40" text-anchor="middle">Tenant MySQL</text><text class="hi" x="790" y="55" text-anchor="middle">per-tenant</text>
    <rect x="920" y="20" width="120" height="44" rx="7" fill="#EDE7F6" stroke="#5E35B1"/><text class="hd" x="980" y="40" text-anchor="middle">Portal FE</text><text class="hi" x="980" y="55" text-anchor="middle">Next.js</text>
    <rect x="1080" y="20" width="120" height="44" rx="7" fill="#E3F2FD" stroke="#1565C0"/><text class="hd" x="1140" y="40" text-anchor="middle">Clinician</text>
  </g>

  <!-- lifelines -->
  <g class="life">
    <line x1="90" y1="64" x2="90" y2="960"/><line x1="250" y1="64" x2="250" y2="960"/>
    <line x1="440" y1="64" x2="440" y2="960"/><line x1="620" y1="64" x2="620" y2="960"/>
    <line x1="790" y1="64" x2="790" y2="960"/><line x1="980" y1="64" x2="980" y2="960"/>
    <line x1="1140" y1="64" x2="1140" y2="960"/>
  </g>

  <!-- Ingest phase band -->
  <rect x="20" y="82" width="1160" height="180" fill="#FFF8F2" opacity="0.6"/>
  <text class="hi" x="30" y="98" fill="#EF6C00">Scan ingest (device → cloud)</text>

  <!-- 1 D->P -->
  <path class="sig" marker-end="url(#s1)" d="M90,120 L246,120"/><text class="num" x="96" y="114">1</text><text class="msg" x="168" y="114" text-anchor="middle">Capture 3D scan + metadata (scan_id, user_id, device_id)</text>
  <!-- 2 P->BE -->
  <path class="sig" marker-end="url(#s1)" d="M250,152 L436,152"/><text class="num" x="256" y="146">2</text><text class="msg" x="343" y="146" text-anchor="middle">Deliver processed scan payload</text>
  <!-- 3 BE->FS -->
  <path class="sig" marker-end="url(#s1)" d="M440,186 L616,186"/><text class="num" x="446" y="180">3</text><text class="msg" x="528" y="180" text-anchor="middle">Store 3D model (PLY/OBJ/STL) + raw archive</text>
  <!-- 4 BE->DB -->
  <path class="sig" marker-end="url(#s1)" d="M440,220 L786,220"/><text class="num" x="446" y="214">4</text><text class="msg" x="600" y="214" text-anchor="middle">Write scan metadata to owning tenant DB</text>
  <rect x="470" y="234" width="360" height="20" rx="4" fill="#FFF3E0" stroke="#EF6C00"/><text class="note" x="650" y="248" text-anchor="middle">Device → tenant → user ownership enforced</text>

  <!-- Review phase band -->
  <rect x="20" y="272" width="1160" height="270" fill="#F7F4FB" opacity="0.6"/>
  <text class="hi" x="30" y="288" fill="#5E35B1">Authenticated review (user → portal)</text>

  <!-- 5 U->FE -->
  <path class="sig" marker-end="url(#s1)" d="M1140,310 L984,310"/><text class="num" x="1128" y="304" text-anchor="end">5</text><text class="msg" x="1060" y="304" text-anchor="middle">Sign in (cookie) + 2FA</text>
  <!-- 6 FE->BE -->
  <path class="sig" marker-end="url(#s1)" d="M980,344 L444,344"/><text class="num" x="972" y="338" text-anchor="end">6</text><text class="msg" x="712" y="338" text-anchor="middle">Request / subscribe scan list (cookie session)</text>
  <rect x="470" y="358" width="440" height="20" rx="4" fill="#FFF8E1" stroke="#F9A825"/><text class="note" x="690" y="372" text-anchor="middle">WebSocket topic users/{client}/scans/list — PLANNED (currently REST/mock, APT-439)</text>
  <!-- 7 BE->DB -->
  <path class="sig" marker-end="url(#s1)" d="M440,398 L786,398"/><text class="num" x="446" y="392">7</text><text class="msg" x="610" y="392" text-anchor="middle">Query tenant-scoped scans</text>
  <!-- 8 DB-->BE -->
  <path class="ret" marker-end="url(#s1)" d="M790,430 L444,430"/><text class="num" x="784" y="424" text-anchor="end">8</text><text class="msg" x="610" y="424" text-anchor="middle">rows</text>
  <!-- 9 BE-->FE -->
  <path class="ret" marker-end="url(#s1)" d="M440,464 L976,464"/><text class="num" x="446" y="458">9</text><text class="msg" x="712" y="458" text-anchor="middle">Scan list (metadata + signed *_url)</text>
  <!-- 10 FE-->U -->
  <path class="ret" marker-end="url(#s1)" d="M980,498 L1136,498"/><text class="num" x="986" y="492">10</text><text class="msg" x="1060" y="492" text-anchor="middle">Render list</text>

  <!-- View phase band -->
  <rect x="20" y="542" width="1160" height="200" fill="#F4FAF5" opacity="0.6"/>
  <text class="hi" x="30" y="558" fill="#2E7D32">3D model view (client-side render)</text>

  <!-- 11 U->FE -->
  <path class="sig" marker-end="url(#s1)" d="M1140,580 L984,580"/><text class="num" x="1128" y="574" text-anchor="end">11</text><text class="msg" x="1060" y="574" text-anchor="middle">Open scan</text>
  <!-- 12 FE->FS -->
  <path class="sig" marker-end="url(#s1)" d="M980,614 L624,614"/><text class="num" x="972" y="608" text-anchor="end">12</text><text class="msg" x="800" y="608" text-anchor="middle">GET signed model URL</text>
  <!-- 13 FS-->FE -->
  <path class="ret" marker-end="url(#s1)" d="M620,648 L976,648"/><text class="num" x="626" y="642">13</text><text class="msg" x="800" y="642" text-anchor="middle">Model file bytes</text>
  <rect x="855" y="662" width="250" height="20" rx="4" fill="#E8F5E9" stroke="#2E7D32"/><text class="note" x="980" y="676" text-anchor="middle">three.js render · IndexedDB cache (LRU)</text>
  <!-- 14 FE-->U -->
  <path class="ret" marker-end="url(#s1)" d="M980,706 L1136,706"/><text class="num" x="986" y="700">14</text><text class="msg" x="1060" y="700" text-anchor="middle">Interactive 3D model</text>

  <!-- Export phase band -->
  <rect x="20" y="742" width="1160" height="200" fill="#F7F4FB" opacity="0.5"/>
  <text class="hi" x="30" y="758" fill="#5E35B1">Export (credit-metered)</text>

  <!-- 15 U->FE -->
  <path class="sig" marker-end="url(#s1)" d="M1140,780 L984,780"/><text class="num" x="1128" y="774" text-anchor="end">15</text><text class="msg" x="1060" y="774" text-anchor="middle">Download / export</text>
  <!-- 16 FE->BE -->
  <path class="sig" marker-end="url(#s1)" d="M980,814 L444,814"/><text class="num" x="972" y="808" text-anchor="end">16</text><text class="msg" x="712" y="808" text-anchor="middle">Request export + consume credit</text>
  <!-- 17 BE->DB -->
  <path class="sig" marker-end="url(#s1)" d="M440,848 L786,848"/><text class="num" x="446" y="842">17</text><text class="msg" x="610" y="842" text-anchor="middle">Decrement credit balance</text>
  <!-- 18 BE-->FE -->
  <path class="ret" marker-end="url(#s1)" d="M440,882 L976,882"/><text class="num" x="446" y="876">18</text><text class="msg" x="712" y="876" text-anchor="middle">Signed download URL</text>
  <!-- 19 FE-->U -->
  <path class="ret" marker-end="url(#s1)" d="M980,916 L1136,916"/><text class="num" x="986" y="910">19</text><text class="msg" x="1060" y="910" text-anchor="middle">File download</text>

  <text class="hi" x="1180" y="960" text-anchor="end">APT-DOC-009 · Figure 3 — Scan Data Flow</text>
</svg>
