name: CI
on:
  pull_request:
    branches: [development]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test:ci
      - name: Build
        run: pnpm build
      - name: SOUP vulnerability audit
        run: pnpm audit --prod --audit-level high
