<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#455A64"/></marker>
    <style>
      .lbl{font-size:11px;fill:#37474F}
      .t{font-size:13px;fill:#1a1a1a}
      .ti{font-size:11px;font-style:italic;fill:#546E7A}
      .h{font-size:12px;font-weight:bold;fill:#37474F}
      .edge{stroke:#455A64;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect width="1080" height="720" fill="#ffffff"/>

  <!-- Actors row -->
  <g>
    <rect x="40" y="30" width="220" height="60" rx="8" fill="#E3F2FD" stroke="#1565C0"/>
    <text class="t" x="150" y="55" text-anchor="middle">Tenant User / Clinician</text>
    <text class="ti" x="150" y="72" text-anchor="middle">(podiatry)</text>
    <rect x="300" y="30" width="200" height="60" rx="8" fill="#E3F2FD" stroke="#1565C0"/>
    <text class="t" x="400" y="65" text-anchor="middle">Tenant Administrator</text>
    <rect x="540" y="30" width="200" height="60" rx="8" fill="#E3F2FD" stroke="#1565C0"/>
    <text class="t" x="640" y="58" text-anchor="middle">Support /</text>
    <text class="t" x="640" y="74" text-anchor="middle">Quality Reviewer</text>
    <rect x="820" y="30" width="220" height="60" rx="8" fill="#E3F2FD" stroke="#1565C0"/>
    <text class="t" x="930" y="65" text-anchor="middle">Platform Administrator</text>
  </g>

  <!-- Front end -->
  <rect x="390" y="150" width="300" height="72" rx="10" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2"/>
  <text class="t" x="540" y="178" text-anchor="middle" font-weight="bold">Web Portal (front-end)</text>
  <text class="ti" x="540" y="197" text-anchor="middle">Next.js 16 · React 19 · TypeScript</text>
  <text class="ti" x="540" y="213" text-anchor="middle">Software item · Class A (built to Class C process)</text>

  <!-- actor to FE arrows -->
  <path class="edge" marker-end="url(#arw)" d="M150,90 L150,130 L410,130 L410,148"/>
  <path class="edge" marker-end="url(#arw)" d="M400,90 L400,120 L470,120 L470,148"/>
  <path class="edge" marker-end="url(#arw)" d="M640,90 L640,120 L610,120 L610,148"/>
  <path class="edge" marker-end="url(#arw)" d="M930,90 L930,130 L670,130 L670,148"/>
  <text class="lbl" x="700" y="126" text-anchor="middle">HTTPS</text>

  <!-- Back end -->
  <rect x="390" y="300" width="300" height="66" rx="10" fill="#E1F5FE" stroke="#0277BD" stroke-width="2"/>
  <text class="t" x="540" y="330" text-anchor="middle" font-weight="bold">Back-end Service / API</text>
  <text class="ti" x="540" y="349" text-anchor="middle">TypeScript · Express</text>

  <!-- FE <-> BE -->
  <path class="edge" marker-end="url(#arw)" d="M540,222 L540,298"/>
  <path class="edge" marker-end="url(#arw)" d="M560,298 L560,222"/>
  <text class="lbl" x="640" y="255" text-anchor="middle">REST + WebSocket</text>
  <text class="lbl" x="640" y="269" text-anchor="middle">HTTP-only cookie session</text>

  <!-- Device domain (left) -->
  <rect x="30" y="285" width="300" height="150" rx="10" fill="none" stroke="#EF6C00" stroke-dasharray="6 4"/>
  <text class="h" x="180" y="305" text-anchor="middle" fill="#EF6C00">Medical Device Domain — black box to Aptium</text>
  <rect x="55" y="318" width="250" height="46" rx="8" fill="#FFF3E0" stroke="#EF6C00"/>
  <text class="t" x="180" y="337" text-anchor="middle">MultiScan4D Scanner</text>
  <text class="ti" x="180" y="353" text-anchor="middle">Class A medical device</text>
  <rect x="55" y="376" width="250" height="46" rx="8" fill="#FFF3E0" stroke="#EF6C00"/>
  <text class="t" x="180" y="395" text-anchor="middle">Scan Processing Pipeline</text>
  <text class="ti" x="180" y="411" text-anchor="middle">opaque upstream of back-end</text>
  <path class="edge" marker-end="url(#arw)" d="M180,364 L180,374"/>
  <path class="edge" marker-end="url(#arw)" d="M305,399 L360,399 L360,333 L388,333"/>
  <text class="lbl" x="360" y="360" text-anchor="middle">scan +</text>
  <text class="lbl" x="360" y="373" text-anchor="middle">metadata</text>

  <!-- Data stores (right) -->
  <rect x="760" y="290" width="290" height="40" rx="8" fill="#E8F5E9" stroke="#2E7D32"/>
  <text class="t" x="905" y="315" text-anchor="middle">Per-tenant MySQL databases (segregated)</text>
  <rect x="760" y="340" width="290" height="46" rx="8" fill="#E8F5E9" stroke="#2E7D32"/>
  <text class="t" x="905" y="360" text-anchor="middle">Rust File Service → Object Storage (S3)</text>
  <text class="ti" x="905" y="376" text-anchor="middle">3D models · raw scan archives (via AWS SDK)</text>
  <path class="edge" marker-end="url(#arw)" d="M690,320 L756,310"/>
  <path class="edge" marker-end="url(#arw)" d="M756,320 L692,330"/>
  <path class="edge" marker-end="url(#arw)" d="M690,345 L756,360"/>
  <path class="edge" marker-end="url(#arw)" d="M756,372 L692,352"/>

  <!-- External services bottom -->
  <rect x="120" y="500" width="240" height="56" rx="8" fill="#ECEFF1" stroke="#546E7A"/>
  <text class="t" x="240" y="524" text-anchor="middle">Email / SMS Service</text>
  <text class="ti" x="240" y="540" text-anchor="middle">2FA · resets · notifications</text>
  <rect x="420" y="500" width="240" height="56" rx="8" fill="#ECEFF1" stroke="#546E7A"/>
  <text class="t" x="540" y="524" text-anchor="middle">Google Places API</text>
  <text class="ti" x="540" y="540" text-anchor="middle">address lookup (proxied)</text>
  <rect x="720" y="500" width="240" height="56" rx="8" fill="#ECEFF1" stroke="#546E7A"/>
  <text class="t" x="840" y="524" text-anchor="middle">Credits / Token System</text>
  <text class="ti" x="840" y="540" text-anchor="middle">no direct payments taken</text>

  <path class="edge" marker-end="url(#arw)" d="M470,366 L300,498"/>
  <path class="edge" marker-end="url(#arw)" d="M540,366 L540,498"/>
  <path class="edge" marker-end="url(#arw)" d="M610,366 L800,498"/>

  <!-- legend -->
  <g transform="translate(40,600)">
    <text class="h" x="0" y="0">Legend</text>
    <rect x="0" y="10" width="18" height="14" rx="3" fill="#E3F2FD" stroke="#1565C0"/><text class="lbl" x="24" y="21">Actor</text>
    <rect x="90" y="10" width="18" height="14" rx="3" fill="#EDE7F6" stroke="#5E35B1"/><text class="lbl" x="114" y="21">Front-end</text>
    <rect x="200" y="10" width="18" height="14" rx="3" fill="#E1F5FE" stroke="#0277BD"/><text class="lbl" x="224" y="21">Back-end</text>
    <rect x="310" y="10" width="18" height="14" rx="3" fill="#E8F5E9" stroke="#2E7D32"/><text class="lbl" x="334" y="21">Data store</text>
    <rect x="420" y="10" width="18" height="14" rx="3" fill="#FFF3E0" stroke="#EF6C00"/><text class="lbl" x="444" y="21">Device (Class A)</text>
    <rect x="560" y="10" width="18" height="14" rx="3" fill="#ECEFF1" stroke="#546E7A"/><text class="lbl" x="584" y="21">External service</text>
  </g>
  <text class="ti" x="1040" y="700" text-anchor="end">APT-DOC-009 · Figure 1 — System Context</text>
</svg>
